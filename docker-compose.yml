services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng-cnes
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_BIND_ADDRESS=0.0.0.0:8080
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-cnes
    restart: unless-stopped
    ports:
      - "6333:6333"   # API HTTP & Dashboard Web
      - "6334:6334"   # Port gRPC (high performance)
    volumes:
      - ./qdrant_db:/qdrant/storage:z